{{- if .Values.horizon.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-horizon"
  annotations:
    rollme: "{{ now | unixEpoch }}"
spec:
  replicas: {{ .Values.horizon.replicas }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-horizon"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-horizon"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      imagePullSecrets:
        - name: {{ .Values.serviceAccount.imagePullSecret }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}"
          command: ["php", "artisan", "horizon"]
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.ingress.internalPort }}
          envFrom:
          - secretRef:
              name: "{{ .Release.Name }}-secret-doppler"
          - configMapRef:
              name: "{{ .Release.Name }}-config"
{{- end }}